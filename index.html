<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto WebDev</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- menu de navegação -->
  <nav class="navbar">
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    <ul id="nav-links" class="nav-links">
      <li><a href="#">Início</a></li>
      <li><a href="#">Sobre</a></li>
      <li><a href="#">Contato</a></li>
    </ul>
    <div id="themes">
      <button onclick="changeTheme('white')">🌞</button>
      <button onclick="changeTheme('#111')">🌚</button>
      <button onclick="changeTheme('#f0f')">🎨</button>
    </div>
  </nav>

  <!-- Slideshow -->
  <div class="slideshow-container">
    <img id="slide" src="assets/slide1.jpg" alt="Slideshow" />
  </div>

  <!-- Formulário -->
  <form id="contact-form">
    <input type="text" id="name" placeholder="Nome" required />
    <input type="email" id="email" placeholder="Email" required />
    <textarea id="message" placeholder="Mensagem" required></textarea>
    <button type="submit">Enviar</button>
  </form>
  <p id="form-msg"></p>

  <!-- Quiz -->
<section id="quiz-section">
  <h2>Quiz: Enchentes e Tecnologia</h2>
  <div id="quiz-container">
    <div id="quiz-question"></div>
    <div id="quiz-options"></div>
    <button id="next-btn" style="display: none;">Próxima</button>
    <div id="quiz-result"></div>
  </div>
</section>

  <script src="script.js"></script>
</body>
</html>
